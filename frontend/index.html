<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HACKALEM AI — ekt.kz</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div><span class="logo">ekt.kz</span><span class="badge">HACKALEM AI</span></div>
        <a id="cart-link" class="cart" href="#cart">Корзина <span id="cart-count">0</span></a>
      </header>
      <section class="hero"><p class="eyebrow">ИИ-АССИСТЕНТ-КОНСУЛЬТАНТ</p><h1>Поможем подобрать<br />электротехнику</h1><p>Спросите о товаре, наличии, характеристиках, сертификатах или аналогах.</p></section>
      <section class="chat-card">
        <div id="messages" class="messages"><div class="message assistant">Здравствуйте! Я помогу найти товар в каталоге ekt.kz. Что вас интересует?</div></div>
        <div id="product-list" class="product-list"></div>
        <form id="chat-form" class="composer"><input id="message-input" autocomplete="off" placeholder="Например: есть ли ВА47-29 2P C16?" /><button>Отправить</button></form>
        <div class="quick"><button data-message="Есть ли автомат ВА47-29 2P C16?">Наличие</button><button data-message="Покажи характеристики и сертификат ВА47-29 2P C16">Характеристики</button><button data-message="Какие условия оплаты и доставки?">Условия покупки</button></div>
      </section>
      <section id="cart" class="cart-panel"><div><p class="eyebrow">ВАША КОРЗИНА</p><h2>Текущий заказ</h2></div><div id="cart-items" class="cart-items">Корзина пока пуста</div><div class="cart-total">Итого: <strong id="cart-total">0 ₸</strong></div></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
